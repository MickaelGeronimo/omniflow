services:
  postgres:
    image: postgres:16-alpine
    container_name: omniflow-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: omniflow_db
      POSTGRES_USER: omniflow_user
      POSTGRES_PASSWORD: omniflow_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omniflow_user -d omniflow_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7.0
    container_name: omniflow-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: omniflow_audit
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  localstack:
    image: localstack/localstack:3.7.2
    container_name: omniflow-localstack
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3,sqs,sns,iam
      AWS_DEFAULT_REGION: us-east-1
      PERSISTENCE: 0
    volumes:
      - "./localstack-init:/etc/localstack/init/ready.d"
      - "/var/run/docker.sock:/var/run/docker.sock"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  mongo_data:
