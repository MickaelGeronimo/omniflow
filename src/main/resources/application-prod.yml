# ====================================================================
# OmniFlow Production Profile: Strict Secrets & Cloud Infrastructure
# Fails fast on startup if environment variables or secrets are missing.
# ZERO DEFAULT FALLBACKS PERMITTED IN PRODUCTION.
# ====================================================================
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      idle-timeout: 300000
      connection-timeout: 10000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: false

  data:
    mongodb:
      uri: ${MONGO_URI}

  cloud:
    aws:
      region:
        static: ${AWS_REGION}
      credentials:
        access-key: ${AWS_ACCESS_KEY_ID}
        secret-key: ${AWS_SECRET_ACCESS_KEY}

omniflow:
  security:
    jwt-secret: ${JWT_SECRET}
    api-key: ${API_KEY}

management:
  endpoint:
    health:
      show-details: when_authorized
