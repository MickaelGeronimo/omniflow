server:
  port: 8080

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: omniflow-core

  datasource:
    # LOCAL/DEMO ONLY: Production deployments must override DB_URL, DB_USERNAME, DB_PASSWORD
    url: ${DB_URL:jdbc:postgresql://localhost:5432/omniflow_db}
    username: ${DB_USERNAME:omniflow_user}
    password: ${DB_PASSWORD:omniflow_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      pool-name: OmniFlowHikariPool

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 25
          order_inserts: true
          order_updates: true

  flyway:
    enabled: true
    baseline-on-migrate: true

  data:
    mongodb:
      # LOCAL/DEMO ONLY: Production deployments must override MONGO_URI
      uri: ${MONGO_URI:mongodb://localhost:27017/omniflow_audit}

  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false

  cloud:
    aws:
      region:
        static: ${AWS_REGION:us-east-1}
      credentials:
        access-key: ${AWS_ACCESS_KEY_ID:test}
        secret-key: ${AWS_SECRET_ACCESS_KEY:test}
      sqs:
        endpoint: ${AWS_ENDPOINT_URL:http://localhost:4566}
      sns:
        endpoint: ${AWS_ENDPOINT_URL:http://localhost:4566}
      s3:
        endpoint: ${AWS_ENDPOINT_URL:http://localhost:4566}

omniflow:
  aws:
    sns-topic-name: ${SNS_TOPIC_NAME:omniflow-transactions-topic}
    sqs-queue-name: ${SQS_QUEUE_NAME:omniflow-settlement-queue}
    s3-bucket-name: ${S3_BUCKET_NAME:omniflow-reconciliation-reports}
  security:
    # LOCAL/DEMO ONLY: Production deployments must override JWT_SECRET and API_KEY
    jwt-secret: ${JWT_SECRET:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
    rate-limit:
      requests-per-minute: 10000
  ai:
    # Active engine: 'deterministic' (production-safe, zero hallucination). Options: deterministic | spring-ai
    engine: ${OMNIFLOW_AI_ENGINE:deterministic}
    # Target model for architectural preview when Spring AI ChatModel is wired
    preview-target-model: gpt-4o-mini
    confidence-threshold: 0.85
    human-approval-threshold: 10000.00

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{correlationId:-NO-CORR}] %-5level %logger{36} - %msg%n"
